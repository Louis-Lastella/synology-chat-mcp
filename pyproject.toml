[project]
name = "synology-chat-mcp"
version = "0.2.0"
description = "MCP server for Synology Chat: read channels and posts, find users, send messages and files"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Louis Lastella" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.0",
    "synology-api>=0.9.2",
]
keywords = ["mcp", "synology", "synology-chat", "model-context-protocol"]

[project.urls]
Repository = "https://github.com/Louis-Lastella/synology-chat-mcp"

[project.scripts]
synology-chat-mcp = "synology_chat_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
